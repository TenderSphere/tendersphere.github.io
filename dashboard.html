<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard | TenderSphere Intelligence</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
:root {
--primary: #00f2ff;
--secondary: #7000ff;
--bg: #03030b;
--card-bg: rgba(255, 255, 255, 0.04);
--glass-border: rgba(255, 255, 255, 0.1);
--text: #f0f0f5;
--muted: #a0a0b5;
--grad: linear-gradient(135deg, #00f2ff 0%, #7000ff 100%);
}
body {
margin: 0;
background-color: var(--bg);
color: var(--text);
font-family: 'Plus Jakarta Sans', sans-serif;
min-height: 100vh;
padding: 20px;
box-sizing: border-box;
background-image: radial-gradient(circle at 0% 0%, rgba(112, 0, 255, 0.15) 0%, transparent 35%),
radial-gradient(circle at 100% 100%, rgba(0, 242, 255, 0.15) 0%, transparent 35%);
}
.top-bar {
max-width: 900px;
margin: 0 auto 30px auto;
display: flex;
justify-content: space-between;
align-items: center;
}
.logo-box { display: flex; align-items: center; gap: 12px; }
.logo-icon {
background: var(--grad);
width: 40px; height: 40px; border-radius: 10px;
display: flex; align-items: center; justify-content: center;
font-weight: 800; color: #000; font-size: 0.9rem;
}
.logout-btn {
background: rgba(255,255,255,0.05);
border: 1px solid var(--glass-border);
color: var(--text);
padding: 10px 20px;
border-radius: 12px;
cursor: pointer;
font-family: inherit;
font-size: 0.9rem;
display: flex;
align-items: center;
gap: 8px;
transition: 0.3s;
}
.logout-btn:hover { border-color: #ff5050; color: #ff8080; }
.container { max-width: 900px; margin: 0 auto; }
.card {
background: var(--card-bg);
backdrop-filter: blur(20px);
border: 1px solid var(--glass-border);
border-radius: 30px;
padding: 45px;
box-shadow: 0 50px 100px rgba(0,0,0,0.5);
}
.welcome-header { margin-bottom: 35px; }
.welcome-header h1 { margin: 0 0 8px 0; font-size: 2rem; }
.welcome-header p { color: var(--muted); margin: 0; }
.detail-grid {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 20px;
}
.detail-box {
background: rgba(255,255,255,0.03);
border: 1px solid var(--glass-border);
border-radius: 15px;
padding: 20px;
}
.detail-label {
font-size: 0.75rem;
color: var(--muted);
text-transform: uppercase;
letter-spacing: 1px;
margin-bottom: 8px;
display: flex;
align-items: center;
gap: 8px;
}
.detail-value { font-size: 1.1rem; font-weight: 600; }
.interests-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.interest-tag {
background: rgba(0, 242, 255, 0.1);
border: 1px solid var(--primary);
color: var(--primary);
padding: 6px 14px;
border-radius: 20px;
font-size: 0.85rem;
}
.loading, .error-state { text-align: center; padding: 60px 20px; color: var(--muted); }
.error-state a { color: var(--primary); }
@media (max-width: 700px) {
.detail-grid { grid-template-columns: 1fr; }
.card { padding: 30px 25px; }
}
</style>
</head>
<body>
<div class="top-bar">
    <div class="logo-box">
        <div class="logo-icon">TS</div>
        <h2 style="letter-spacing: 2px; font-size: 1.1rem; margin: 0;">TENDER<span style="color:var(--primary); font-weight: 300;">SPHERE</span></h2>
    </div>
    <button class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>
</div>

<div class="container">
    <div class="card animate__animated animate__fadeIn" id="cardContent">
        <div class="loading" id="loadingState">
            <i class="fas fa-spinner fa-spin" style="font-size: 2rem; margin-bottom: 15px;"></i>
            <p>Loading your profile...</p>
        </div>
    </div>
</div>

<script>
const API_URL = "https://tendersphere-backend.onrender.com/api";
const token = localStorage.getItem('access_token');

const cardContent = document.getElementById('cardContent');

if (!token) {
    window.location.href = "login.html";
}

document.getElementById('logoutBtn').addEventListener('click', () => {
    localStorage.removeItem('access_token');
    window.location.href = "login.html";
});

async function loadProfile() {
    try {
        const res = await fetch(`${API_URL}/profile/`, {
            method: "GET",
            headers: { "Authorization": `Bearer ${token}` },
        });

        if (res.status === 401) {
            localStorage.removeItem('access_token');
            window.location.href = "login.html";
            return;
        }

        const data = await res.json();

        if (res.ok) {
            const interestsList = data.tender_interests
                ? data.tender_interests.split(',').map(i => i.trim()).filter(Boolean)
                : [];

            cardContent.innerHTML = `
                <div class="welcome-header">
                    <h1>Welcome back, ${data.username}!</h1>
                    <p>Here's what we have on file for your account.</p>
                </div>
                <div class="detail-grid">
                    <div class="detail-box">
                        <div class="detail-label"><i class="fas fa-user"></i> Username</div>
                        <div class="detail-value">${data.username}</div>
                    </div>
                    <div class="detail-box">
                        <div class="detail-label"><i class="fas fa-envelope"></i> Email</div>
                        <div class="detail-value">${data.email}</div>
                    </div>
                    <div class="detail-box">
                        <div class="detail-label"><i class="fas fa-phone"></i> Phone</div>
                        <div class="detail-value">${data.phone}</div>
                    </div>
                    <div class="detail-box">
                        <div class="detail-label"><i class="fas fa-location-dot"></i> State</div>
                        <div class="detail-value">${data.state}</div>
                    </div>
                    <div class="detail-box" style="grid-column: 1 / -1;">
                        <div class="detail-label"><i class="fas fa-bookmark"></i> Tender Interests</div>
                        <div class="interests-row">
                            ${interestsList.map(i => `<span class="interest-tag">${i}</span>`).join('') || '<span style="color: var(--muted);">None selected</span>'}
                        </div>
                    </div>
                </div>
            `;
        } else {
            cardContent.innerHTML = `<div class="error-state"><p>Could not load your profile. Please <a href="login.html">log in</a> again.</p></div>`;
        }
    } catch (err) {
        cardContent.innerHTML = `<div class="error-state"><p>Could not reach the server. Please check your connection and try again.</p></div>`;
    }
}

loadProfile();
</script>
</body>
</html>
