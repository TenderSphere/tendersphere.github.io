<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Tender | TenderSphere Admin</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
:root {
--primary: #00f2ff;
--secondary: #7000ff;
--bg: #03030b;
--card-bg: rgba(255, 255, 255, 0.04);
--glass-border: rgba(255, 255, 255, 0.1);
--text: #f0f0f5;
--muted: #a0a0b5;
--grad: linear-gradient(135deg, #00f2ff 0%, #7000ff 100%);
}
body {
margin: 0;
background-color: var(--bg);
color: var(--text);
font-family: 'Plus Jakarta Sans', sans-serif;
min-height: 100vh;
padding: 30px 20px;
box-sizing: border-box;
background-image: radial-gradient(circle at 0% 0%, rgba(112, 0, 255, 0.15) 0%, transparent 35%),
radial-gradient(circle at 100% 100%, rgba(0, 242, 255, 0.15) 0%, transparent 35%);
}
.top-bar {
max-width: 800px;
margin: 0 auto 25px auto;
display: flex;
justify-content: space-between;
align-items: center;
}
.logo-box { display: flex; align-items: center; gap: 12px; }
.logo-icon {
background: var(--grad);
width: 40px; height: 40px; border-radius: 10px;
display: flex; align-items: center; justify-content: center;
font-weight: 800; color: #000; font-size: 0.9rem;
}
.nav-link {
color: var(--muted);
text-decoration: none;
font-size: 0.9rem;
display: flex;
align-items: center;
gap: 8px;
}
.container { max-width: 800px; margin: 0 auto; }
.card {
background: var(--card-bg);
backdrop-filter: blur(20px);
border: 1px solid var(--glass-border);
border-radius: 30px;
padding: 45px;
box-shadow: 0 50px 100px rgba(0,0,0,0.5);
}
.card h1 { margin: 0 0 8px 0; font-size: 1.6rem; }
.card > p { color: var(--muted); margin: 0 0 30px 0; font-size: 0.9rem; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.field-group { margin-bottom: 18px; }
.field-group.full { grid-column: 1 / -1; }
label {
font-size: 0.75rem;
color: var(--muted);
text-transform: uppercase;
letter-spacing: 0.5px;
margin-bottom: 8px;
display: block;
font-weight: 600;
}
.form-input, .form-select, textarea {
width: 100%;
background: rgba(255,255,255,0.05);
border: 1px solid var(--glass-border);
padding: 14px 16px;
border-radius: 12px;
color: #fff;
font-size: 0.95rem;
transition: 0.3s;
box-sizing: border-box;
font-family: inherit;
}
textarea { resize: vertical; min-height: 90px; }
.form-select option { background: #0a0a15; }
.form-input:focus, .form-select:focus, textarea:focus {
outline: none;
border-color: var(--primary);
background: rgba(0, 242, 255, 0.05);
box-shadow: 0 0 20px rgba(0, 242, 255, 0.1);
}
.btn-submit {
background: var(--grad);
width: 100%;
padding: 16px;
border-radius: 15px;
border: none;
color: #000;
font-weight: 800;
font-size: 0.95rem;
cursor: pointer;
transition: 0.4s;
text-transform: uppercase;
letter-spacing: 1px;
margin-top: 10px;
}
.btn-submit:hover { transform: translateY(-2px); box-shadow: 0 15px 30px rgba(0, 242, 255, 0.3); }
.btn-submit:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
.msg-box {
padding: 14px 18px;
border-radius: 12px;
margin-bottom: 20px;
font-size: 0.9rem;
display: none;
}
.msg-success { background: rgba(0, 242, 255, 0.1); border: 1px solid var(--primary); color: var(--primary); }
.msg-error { background: rgba(255, 60, 60, 0.1); border: 1px solid #ff5050; color: #ff8080; }
@media (max-width: 700px) {
.form-row { grid-template-columns: 1fr; }
.card { padding: 30px 22px; }
}
</style>
</head>
<body>
<div class="top-bar">
    <div class="logo-box">
        <div class="logo-icon">TS</div>
        <h2 style="letter-spacing: 2px; font-size: 1rem; margin: 0;">TENDER<span style="color:var(--primary); font-weight: 300;">SPHERE</span></h2>
    </div>
    <a href="dashboard.html" class="nav-link"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
</div>

<div class="container">
    <div class="card animate__animated animate__fadeIn">
        <h1>Add New Tender</h1>
        <p>Fill in the details below. Only admin accounts can submit.</p>

        <div id="successMsg" class="msg-box msg-success"></div>
        <div id="errorMsg" class="msg-box msg-error"></div>

        <form id="tenderForm">
            <div class="field-group full">
                <label>Title</label>
                <input type="text" id="title" class="form-input" placeholder="e.g. Insurance Coverage for Food Storage Godowns" required>
            </div>

            <div class="field-group full">
                <label>Description</label>
                <textarea id="description" placeholder="Short summary of what's being procured" required></textarea>
            </div>

            <div class="form-row">
                <div class="field-group">
                    <label>Department</label>
                    <input type="text" id="department" class="form-input" placeholder="e.g. West Bengal State Warehousing Corporation" required>
                </div>
                <div class="field-group">
                    <label>Category</label>
                    <select id="category" class="form-select" required>
                        <option value="" disabled selected>Select category</option>
                        <option value="Construction">Construction</option>
                        <option value="IT & Software">IT & Software</option>
                        <option value="Healthcare">Healthcare</option>
                        <option value="Defence">Defence</option>
                        <option value="Education">Education</option>
                        <option value="Transport">Transport</option>
                        <option value="Energy">Energy</option>
                        <option value="Agriculture">Agriculture</option>
                        <option value="Insurance & Financial Services">Insurance & Financial Services</option>
                        <option value="Consultancy & Professional Services">Consultancy & Professional Services</option>
                        <option value="Manufacturing & Supply">Manufacturing & Supply</option>
                        <option value="Facility Management">Facility Management</option>
                        <option value="Telecommunications">Telecommunications</option>
                        <option value="Water & Sanitation">Water & Sanitation</option>
                        <option value="Legal & Compliance">Legal & Compliance</option>
                        <option value="Miscellaneous">Miscellaneous</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="field-group">
                    <label>State</label>
                    <select id="state" class="form-select" required>
                        <option value="" disabled selected>Select state</option>
                        <option value="AP">Andhra Pradesh</option>
                        <option value="AR">Arunachal Pradesh</option>
                        <option value="AS">Assam</option>
                        <option value="BR">Bihar</option>
                        <option value="CG">Chhattisgarh</option>
                        <option value="GA">Goa</option>
                        <option value="GJ">Gujarat</option>
                        <option value="HR">Haryana</option>
                        <option value="HP">Himachal Pradesh</option>
                        <option value="JH">Jharkhand</option>
                        <option value="KA">Karnataka</option>
                        <option value="KL">Kerala</option>
                        <option value="MP">Madhya Pradesh</option>
                        <option value="MH">Maharashtra</option>
                        <option value="MN">Manipur</option>
                        <option value="ML">Meghalaya</option>
                        <option value="MZ">Mizoram</option>
                        <option value="NL">Nagaland</option>
                        <option value="OD">Odisha</option>
                        <option value="PB">Punjab</option>
                        <option value="RJ">Rajasthan</option>
                        <option value="SK">Sikkim</option>
                        <option value="TN">Tamil Nadu</option>
                        <option value="TS">Telangana</option>
                        <option value="TR">Tripura</option>
                        <option value="UP">Uttar Pradesh</option>
                        <option value="UK">Uttarakhand</option>
                        <option value="WB">West Bengal</option>
                        <option value="DL">Delhi</option>
                    </select>
                </div>
                <div class="field-group">
                    <label>Tender Value (optional)</label>
                    <input type="text" id="tenderValue" class="form-input" placeholder="e.g. \u20b925,00,000">
                </div>
            </div>

            <div class="form-row">
                <div class="field-group">
                    <label>Deadline</label>
                    <input type="date" id="deadline" class="form-input" required>
                </div>
                <div class="field-group">
                    <label>Reference Number</label>
                    <input type="text" id="referenceNumber" class="form-input" placeholder="e.g. 708/Genl./D (I)-3/Fire/RIDF/SWC" required>
                </div>
            </div>

            <div class="field-group full">
                <label>Document Link (optional)</label>
                <input type="url" id="documentLink" class="form-input" placeholder="https://...">
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">Add Tender</button>
        </form>
    </div>
</div>

<script>
const API_URL = "https://tendersphere-backend.onrender.com/api";
const token = localStorage.getItem('access_token');

if (!token) {
    alert("Please log in first.");
    window.location.href = "login.html";
}

const successMsg = document.getElementById('successMsg');
const errorMsg = document.getElementById('errorMsg');

document.getElementById('tenderForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const payload = {
        title: document.getElementById('title').value.trim(),
        description: document.getElementById('description').value.trim(),
        department: document.getElementById('department').value.trim(),
        category: document.getElementById('category').value,
        state: document.getElementById('state').value,
        tender_value: document.getElementById('tenderValue').value.trim(),
        deadline: document.getElementById('deadline').value,
        reference_number: document.getElementById('referenceNumber').value.trim(),
        document_link: document.getElementById('documentLink').value.trim(),
    };

    const btn = document.getElementById('submitBtn');
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Adding...';
    btn.disabled = true;
    successMsg.style.display = 'none';
    errorMsg.style.display = 'none';

    try {
        const res = await fetch(`${API_URL}/add-tender/`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${token}`,
            },
            body: JSON.stringify(payload),
        });
        const data = await res.json();

        if (res.ok) {
            successMsg.innerText = "Tender added successfully!";
            successMsg.style.display = 'block';
            document.getElementById('tenderForm').reset();
        } else {
            errorMsg.innerText = data.error || "Something went wrong. Please check the fields and try again.";
            errorMsg.style.display = 'block';
        }
    } catch (err) {
        errorMsg.innerText = "Could not reach the server. Please try again.";
        errorMsg.style.display = 'block';
    } finally {
        btn.innerHTML = 'Add Tender';
        btn.disabled = false;
    }
});
</script>
</body>
</html>
