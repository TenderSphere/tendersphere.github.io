<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password | TenderSphere Intelligence</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
:root {
--primary: #00f2ff;
--secondary: #7000ff;
--bg: #03030b;
--card-bg: rgba(255, 255, 255, 0.04);
--glass-border: rgba(255, 255, 255, 0.1);
--text: #f0f0f5;
--muted: #a0a0b5;
--grad: linear-gradient(135deg, #00f2ff 0%, #7000ff 100%);
}
body {
margin: 0;
background-color: var(--bg);
color: var(--text);
font-family: 'Plus Jakarta Sans', sans-serif;
min-height: 100vh;
display: flex;
align-items: center;
justify-content: center;
padding: 20px;
background-image: radial-gradient(circle at 0% 0%, rgba(112, 0, 255, 0.15) 0%, transparent 35%),
radial-gradient(circle at 100% 100%, rgba(0, 242, 255, 0.15) 0%, transparent 35%);
}
.card {
width: 100%;
max-width: 460px;
background: var(--card-bg);
backdrop-filter: blur(20px);
border: 1px solid var(--glass-border);
border-radius: 30px;
padding: 50px 45px;
box-shadow: 0 50px 100px rgba(0,0,0,0.5);
}
.logo-box { display: flex; align-items: center; gap: 15px; margin-bottom: 30px; }
.logo-icon {
background: var(--grad);
width: 40px; height: 40px; border-radius: 10px;
display: flex; align-items: center; justify-content: center;
font-weight: 800; color: #000; font-size: 0.9rem;
}
.input-group { position: relative; margin-bottom: 20px; }
.input-group i {
position: absolute; left: 20px; top: 50%;
transform: translateY(-50%); color: var(--muted);
}
.form-input {
width: 100%;
background: rgba(255,255,255,0.05);
border: 1px solid var(--glass-border);
padding: 18px 20px 18px 55px;
border-radius: 15px;
color: #fff;
font-size: 1rem;
transition: 0.3s;
box-sizing: border-box;
}
.form-input:focus {
outline: none;
border-color: var(--primary);
background: rgba(0, 242, 255, 0.05);
box-shadow: 0 0 20px rgba(0, 242, 255, 0.1);
}
.btn-login {
background: var(--grad);
width: 100%;
padding: 18px;
border-radius: 15px;
border: none;
color: #000;
font-weight: 800;
font-size: 1rem;
cursor: pointer;
transition: 0.4s;
text-transform: uppercase;
letter-spacing: 1px;
}
.btn-login:hover {
transform: translateY(-3px);
box-shadow: 0 15px 30px rgba(0, 242, 255, 0.3);
filter: brightness(1.1);
}
.btn-login:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
.back-link { text-align: center; margin-top: 25px; font-size: 0.9rem; color: var(--muted); }
.back-link a { color: #fff; text-decoration: none; font-weight: 600; }
.msg-box {
padding: 14px 18px;
border-radius: 12px;
margin-bottom: 20px;
font-size: 0.9rem;
display: none;
}
.msg-success { background: rgba(0, 242, 255, 0.1); border: 1px solid var(--primary); color: var(--primary); }
.msg-error { background: rgba(255, 60, 60, 0.1); border: 1px solid #ff5050; color: #ff8080; }
</style>
</head>
<body>
<div class="card animate__animated animate__zoomIn">
    <div class="logo-box">
        <div class="logo-icon">TS</div>
        <h2 style="letter-spacing: 2px; font-size: 1.1rem;">TENDER<span style="color:var(--primary); font-weight: 300;">SPHERE</span></h2>
    </div>
    <h2 style="margin-bottom: 10px;">Forgot Password?</h2>
    <p style="color: var(--muted); margin-bottom: 30px; font-size: 0.9rem;">Enter your registered email and we'll send you a reset link.</p>

    <div id="successMsg" class="msg-box msg-success"></div>
    <div id="errorMsg" class="msg-box msg-error"></div>

    <form id="forgotForm">
        <div class="input-group">
            <i class="fas fa-envelope"></i>
            <input type="email" id="emailInput" class="form-input" placeholder="Registered Email" required>
        </div>
        <button type="submit" class="btn-login" id="submitBtn">Send Reset Link</button>
    </form>

    <p class="back-link">Remembered it? <a href="login.html">Back to Sign In</a></p>
</div>

<script>
const API_URL = "https://tendersphere-backend.onrender.com/api";

const successMsg = document.getElementById('successMsg');
const errorMsg = document.getElementById('errorMsg');

document.getElementById('forgotForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('emailInput').value.trim();

    const btn = document.getElementById('submitBtn');
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';
    btn.disabled = true;

    try {
        const res = await fetch(`${API_URL}/forgot-password/`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email }),
        });
        const data = await res.json();

        successMsg.innerText = data.message || "If that email is registered, a reset link has been sent.";
        successMsg.style.display = 'block';
        errorMsg.style.display = 'none';
        document.getElementById('forgotForm').style.display = 'none';
    } catch (err) {
        errorMsg.innerText = "Could not reach the server. Please try again.";
        errorMsg.style.display = 'block';
        btn.innerHTML = 'Send Reset Link';
        btn.disabled = false;
    }
});
</script>
</body>
</html>
